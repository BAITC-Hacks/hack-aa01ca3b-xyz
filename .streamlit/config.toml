[browser]
gatherUsageStats = false

[server]
address = "127.0.0.1"
maxUploadSize = 1024
# The source watcher walks every loaded module and trips over transformers lazy imports
fileWatcherType = "none"

[theme]
base = "light"
primaryColor = "#5B3FE0"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F6F4FF"
textColor = "#1E1B3A"
font = "sans serif"
baseRadius = "0.8rem"
