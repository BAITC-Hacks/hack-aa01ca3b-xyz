services:
  ollama:
    image: ollama/ollama:latest
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:4b}
    volumes:
      - ollama_data:/root/.ollama
    entrypoint: ["/bin/sh", "-c"]
    command: >-
      ollama serve & server_pid=$$!;
      until ollama list >/dev/null 2>&1; do sleep 2; done;
      ollama pull "$${OLLAMA_MODEL:-qwen3:4b}";
      wait $$server_pid
    healthcheck:
      test: ["CMD-SHELL", "ollama list | grep -q \"$${OLLAMA_MODEL:-qwen3:4b}\""]
      interval: 15s
      timeout: 10s
      retries: 60
      start_period: 10m
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:4b}
      ALLOW_DOCKER_OLLAMA: "1"
      HF_HOME: /app/models/huggingface
      HF_HUB_OFFLINE: "1"
      PYANNOTE_METRICS_ENABLED: "0"
      HF_HUB_DISABLE_TELEMETRY: "1"
    volumes:
      - model_data:/app/models
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      ollama:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  model_data:
  ollama_data:
